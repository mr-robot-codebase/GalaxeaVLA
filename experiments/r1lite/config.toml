[robot]
hardware = "R1_LITE"
embodiment_type = "galaxea_r1lite"

[basic]
use_ehi = false
control_frequency = 15.0
step_mode = "sync" # Optional["sync", "async"]
action_steps = 16

[websocket]
host = "127.0.0.1"
port = 8080

# Uncomment to run inference in-process on this machine instead of over
# WebSocket (requires a CUDA GPU meeting the repo's Inference requirements,
# and running this client from the repo-root G05 .venv). When present, this
# section takes priority over [websocket].
[local]
ckpt_path = "/home/nvidia/GalaxeaVLA/checkpoints/g05-base/checkpoints/model_state_dict.pt"
device = "cuda"
action_steps = 16
overrides = ["eval_embodiment=galaxea_r1lite"]


[instruction]
use_vlm = false
bbox_as_instruction = false
image_condition_lang_prefix = false
pp_lower_half = false
image_as_condition = false
